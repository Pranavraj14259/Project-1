<!DOCTYPE html>
<html>
<head>
    <title>Basic Selectors</title>

    <style>
        /* Element selector */
        p {
            color: blue;
        }

        /* Class selector */
        .highlight {
            background-color: yellow;
        }

        /* ID selector */
        #footer {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Main Title</h1>

    <p>This is a paragraph.</p>

    <p>This is a paragraph.</p>

    <p class="highlight">This is a highlighted paragraph.</p>

    <div id="footer">Footer Information.</div>

</body>
</html>
